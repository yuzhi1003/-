name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Prepare Files
      run: |
        mkdir -p app/src/main/java/com/yuzhi/banghui
        mkdir -p app/src/main/assets
        cp index.html app/src/main/assets/
        cat > settings.gradle <<'EOF'
        rootProject.name = "BanghuiApp"
        include ':app'
        EOF
        cat > build.gradle <<'EOF'
        buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.1.0' }
        }
        EOF
        cat > app/build.gradle <<'EOF'
        apply plugin: 'com.android.application'
        android {
            namespace 'com.yuzhi.banghui'
            compileSdk 34
            defaultConfig {
                applicationId "com.yuzhi.banghui"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
        }
        EOF
        cat > app/src/main/AndroidManifest.xml <<'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:label="帮会交接">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        cat > app/src/main/java/com/yuzhi/banghui/MainActivity.java <<'EOF'
        package com.yuzhi.banghui;
        import android.app.Activity;
        import android.os.Bundle;
        import android.webkit.WebView;
        import android.webkit.WebSettings;

        public class MainActivity extends Activity {
            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                WebView webView = new WebView(this);
                WebSettings webSettings = webView.getSettings();
                webSettings.setJavaScriptEnabled(true);
                webView.loadUrl("file:///android_asset/index.html");
                setContentView(webView);
            }
        }
        EOF
    - name: Build with Gradle
      run: |
        gradle wrapper
        chmod +x gradlew
        ./gradlew assembleDebug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MyApp-APK
        path: app/build/outputs/apk/debug/app-debug.apk
